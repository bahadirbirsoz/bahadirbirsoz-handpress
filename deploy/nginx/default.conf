server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    try_files /health.json =404;
  }

  location = /sw.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /registerSW.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; try_files $uri =404; }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
