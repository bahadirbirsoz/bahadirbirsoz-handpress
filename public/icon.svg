<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#161f2e" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="#222f42" stroke-width="6" />

  <!-- Film / Clapperboard Body -->
  <rect x="96" y="128" width="320" height="256" rx="36" fill="#151d2a" stroke="#2a3b53" stroke-width="8" />
  
  <!-- Film Sprocket holes -->
  <rect x="120" y="152" width="28" height="28" rx="6" fill="#0ea5e9" opacity="0.8" />
  <rect x="168" y="152" width="28" height="28" rx="6" fill="#0ea5e9" opacity="0.8" />
  <rect x="316" y="152" width="28" height="28" rx="6" fill="#0ea5e9" opacity="0.8" />
  <rect x="364" y="152" width="28" height="28" rx="6" fill="#0ea5e9" opacity="0.8" />

  <!-- Compression Clamps / Arrows -->
  <g fill="none" stroke="url(#brandGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top inward arrow -->
    <path d="M256 160 v 64" />
    <path d="M236 204 l 20 20 l 20 -20" />
    
    <!-- Bottom inward arrow -->
    <path d="M256 352 v -64" />
    <path d="M236 308 l 20 -20 l 20 20" />
    
    <!-- Left inward clamp -->
    <path d="M168 256 h 48" />
    <path d="M196 236 l 20 20 l -20 20" />

    <!-- Right inward clamp -->
    <path d="M344 256 h -48" />
    <path d="M316 236 l -20 20 l 20 20" />
  </g>

  <!-- Core Play/Puck in Center -->
  <circle cx="256" cy="256" r="28" fill="url(#brandGrad)" />
  <polygon points="250,244 268,256 250,268" fill="#0b0f17" />
</svg>
